[platformio]
src_dir = firmware
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
; Arduino ESP32 3.3.7 / ESP-IDF 5.5.2. Pin the toolchain for reproducible builds.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps = gilmaimon/ArduinoWebsockets@0.5.4
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -D_WS_CONFIG_MAX_MESSAGE_SIZE=4096

[env:firmware_ci]
extends = env:xiao_esp32s3
; Compile public defaults even if a developer has a private config.h.
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DNAVGUIDE_USE_EXAMPLE_CONFIG=1

[env:firmware_ci_tls]
extends = env:firmware_ci
build_flags =
    ${env:firmware_ci.build_flags}
    -DNAVGUIDE_TLS=1
