name: Validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - run: python -m pytest -q
      - run: python scripts/package_source.py
      - name: Test the exported source package
        run: |
          python -m zipfile -e dist/NavGuide-source.zip /tmp/navguide-release
          cd /tmp/navguide-release/NavGuide
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.11'
        with:
          name: NavGuide-source
          path: dist/NavGuide-source.zip
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t navguide:test .
      - run: docker build -f deploy/Dockerfile.cloud -t navguide-cloud:test .
      - run: cp deploy/.env.cloud.example deploy/.env.cloud
      - run: docker compose -f deploy/compose.cloud.yaml config --quiet
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18
      - run: bash scripts/test_firmware.sh
      - run: pio run -e firmware_ci -e firmware_ci_tls
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-ci-unconfigured
          path: |
            .pio/build/firmware_ci/*.bin
            .pio/build/firmware_ci_tls/*.bin
